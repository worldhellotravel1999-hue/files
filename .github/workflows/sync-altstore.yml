name: Sync AltStore source

# Asset uploads/deletions have no release event. Schedule is best-effort;
# use Run workflow for immediate synchronization after an upload/delete batch.
on:
  release:
    types: [created, published, edited, released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync
        required: true
        default: nightly
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: altstore-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'release' || github.event.release.tag_name == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test release reconciliation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Sync altstore.json with the IPAs in the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'nightly' }}
        run: python3 .github/scripts/sync-altstore.py
